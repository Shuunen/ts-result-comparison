name: ci

on: push

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node 26 with pnpm cache
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Setup Bun for the build and the benchmarks
        uses: oven-sh/setup-bun@v2

      - name: Install hyperfine for the benchmarks
        run: sudo apt-get update && sudo apt-get install --yes hyperfine && echo install hyperfine ok ✅

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile && echo install dependencies ok ✅

      - name: Run Check
        run: pnpm run check
